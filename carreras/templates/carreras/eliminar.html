<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eliminar Carrera</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a href="{% url 'inicio' %}" class="navbar-brand">
            Universidad
        </a>

        <a href="{% url 'lista_carreras' %}" class="btn btn-light">
            Ver Carreras
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0">Eliminar Carrera</h2>
                </div>

                <div class="card-body text-center">

                    <h4>¿Estás seguro de eliminar esta carrera?</h4>

                    <p class="mt-3">
                        <strong>{{ carrera.nombre }}</strong>
                    </p>

                    <p>
                        Código: {{ carrera.codigo }}
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <button type="submit" class="btn btn-danger">
                            Sí, eliminar
                        </button>

                        <a href="{% url 'lista_carreras' %}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
